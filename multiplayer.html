<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>笙歌曼 联机夜宴</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f3dfb2;background:#0b1d1a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#244a3a,#0b1d1a 70%)}main{max-width:920px;margin:auto;padding:20px}header{text-align:center;padding:25px 0;border-bottom:1px solid #af8b5066}h1{font-family:serif;font-size:clamp(38px,7vw,64px);letter-spacing:.25em;margin:12px 0}h2{font:25px serif;margin:8px 0 20px}p,small{color:#b6bda8}input,button{font:inherit;border:1px solid #a98958;border-radius:6px;padding:13px;background:#19352e;color:#f6e8bd}input{min-width:0;width:100%;margin:5px 0 12px}button{cursor:pointer}button:hover:not(:disabled){background:#365643}button:disabled{opacity:.4}button.primary{background:linear-gradient(110deg,#f0d39c,#b78e53);color:#211a12;font-weight:700}section{background:#102920e9;border:1px solid #b8975c55;border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 10px 22px #0003}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.code{font:32px Georgia,serif;letter-spacing:.15em;color:#f3d49a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.seat,.card{padding:15px 10px;border:1px solid #9f85565c;border-radius:8px;background:#17392e;text-align:center;min-height:105px}.seat strong{display:block;font:19px serif}.seat small{display:block}.card{display:flex;flex-direction:column;justify-content:center;gap:12px}.card strong{font:22px serif}.card.chosen{border:2px solid #ffdd99;transform:translateY(-4px)}.bad{background:#603638;border-color:#e0a18b}#notice{color:#f3ae95;min-height:20px}.hidden{display:none!important}.info{background:#334536;padding:13px;border-left:3px solid #e4b777;margin:12px 0}.log{height:160px;overflow:auto;border:1px solid #8c78444a;padding:10px}.log p{font-size:13px;margin:4px}footer{color:#85998a;text-align:center;padding:30px;font-size:12px}@media(max-width:520px){main{padding:10px}section{padding:15px}button{padding:12px 9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><main><header><small>1935 · PRIVATE DETECTIVE CLUB · LIVE</small><h1>笙歌曼</h1><p>百乐门疑云 · 多人实时联机试玩</p></header><section id="entry"><h2>夜宴入席</h2><label>宾客姓名</label><input id="name" placeholder="输入你的名字" maxlength="20" value="侦探"><div class="row"><button class="primary" onclick="createRoom()">创建房间</button></div><hr style="border:0;border-top:1px solid #8e7c4f55;margin:22px 0"><label>加入已有夜宴</label><input id="roomInput" maxlength="6" placeholder="六位房间码"><button onclick="joinRoom()">凭房间码加入</button><p>单人测试：创建房间 → 添加 3 名 AI → 准备并开局。双人测试：把房间码发给朋友。</p></section><div id="play" class="hidden"><section><div class="row"><div><small>房间号</small><div class="code" id="roomCode"></div></div><div style="text-align:right"><span id="status"></span><br><button onclick="copyInvite()">复制邀请链接</button></div></div><p id="notice"></p></section><section><h2>宾客席</h2><div id="players" class="grid"></div><div class="row" id="lobbyControls"></div></section><section id="game" class="hidden"><small id="round"></small><h2 id="phase"></h2><div id="identity" class="info"></div><p id="instructions"></p><div class="grid" id="options"></div><div id="buttons" class="row" style="margin-top:18px"></div><h2 style="margin-top:25px">已公开线索</h2><div class="grid" id="publicCards"></div><h2 style="margin-top:25px">调查记录</h2><div id="history"></div></section><section><h2>密谈</h2><div class="log" id="messages"></div><div class="row"><input id="chat" placeholder="说点什么……" style="margin:0"><button onclick="sendAction({action:'say',text:document.getElementById('chat').value});document.getElementById('chat').value=''">发送</button></div></section></div><footer>非官方简化规则 · 房间实时同步 · 玩家身份仅本人可见 · Render 测试服务</footer></main>
<script>
let auth=null,ws=null,state=null,sel=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const players=()=>state.players;const me=()=>state.players.find(p=>p.id===state.you);
async function api(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function createRoom(){try{connect(await api('/api/rooms',{name:$('name').value}))}catch(e){alert(e.message)}}
async function joinRoom(){try{connect(await api('/api/join',{name:$('name').value,code:$('roomInput').value.toUpperCase()}))}catch(e){alert(e.message)}}
function connect(a){auth=a;sessionStorage.setItem('sgm_online_auth',JSON.stringify(a));openSocket()}
function openSocket(){if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>ws.send(JSON.stringify({type:'hello',code:auth.code,token:auth.token}));ws.onmessage=ev=>{let d=JSON.parse(ev.data);if(d.type==='state'){state=d.room;$('entry').classList.add('hidden');$('play').classList.remove('hidden');render()}if(d.type==='error'){$('notice').textContent=d.message}};ws.onclose=()=>{$('status').textContent='连接断开，可刷新重连'};ws.onerror=()=>{$('status').textContent='连接错误'}}
function sendAction(payload){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'action',payload}))}
function copyInvite(){let url=location.origin+'/?room='+state.code;navigator.clipboard?.writeText(url).then(()=>{$('notice').textContent='邀请链接已复制'}).catch(()=>{$('notice').textContent=url})}
function option(label,desc,cmd,cl=''){return '<button class="card '+cl+'" onclick="'+cmd+'"><strong>'+esc(label)+'</strong><small>'+esc(desc)+'</small></button>'}
function render(){let s=state;let host=s.host===s.you;$('roomCode').textContent=s.code;$('status').textContent=s.phase==='lobby'?'候场中':'第 '+s.round+' 轮 · '+s.phase;$('players').innerHTML=players().map(p=>'<div class="seat"><strong>'+esc(p.name)+'</strong><small>'+(p.bot?'AI · ':'')+(p.online?'在线':'离线')+(p.id===s.host?' · 房主':'')+'</small><small>'+(s.phase==='lobby'?(p.ready?'已准备':'未准备'):(p.done?'已行动':'行动中'))+'</small></div>').join('');$('lobbyControls').innerHTML=s.phase==='lobby'?'<button onclick="sendAction({action:\'ready\'})">'+(me().ready?'取消准备':'准备')+'</button>'+(host?'<button onclick="sendAction({action:\'bot\'})">添加 AI</button><button class="primary" onclick="sendAction({action:\'start\'})">开始游戏</button>':''):'';
 $('game').classList.toggle('hidden',s.phase==='lobby');if(s.phase!=='lobby')renderGame(host);
 $('messages').innerHTML=s.log.map(m=>'<p><b>'+esc(m.name)+'</b>：'+esc(m.text)+'</p>').join('');}
function renderGame(host){let s=state,done=me().done;let titles={investigate:'秘密调查',submit:'匿名出牌',reveal:'线索公示',vote:'最终指认',end:'真相揭晓'};$('round').textContent='ACT '+s.round+' / III';$('phase').textContent=titles[s.phase];$('identity').textContent=s.phase==='end'?('胜方：'+s.winner+'阵营'):('你的秘密身份：'+s.role);$('options').innerHTML='';$('buttons').innerHTML='';let txt='';
 if(s.phase==='investigate'){txt=done?'你已经调查完毕，等待其他玩家。':'点击一位宾客，查看其随机一张剩余手牌（对方不会看到查牌内容）';if(!done)for(const p of players().filter(p=>p.id!==s.you&&p.handCount>0))$('options').innerHTML+=option(p.name,'查看秘密线索', "sendAction({action:'inspect',playerId:'"+p.id+"',cardId:''})");if(s.peek)txt+=' · 本轮所见：'+s.peek.name+' → '+s.peek.type+' · '+s.peek.label;}
 if(s.phase==='submit'){txt='本轮指定类别：'+s.target+'。良人与帮凶只能提交该类别；真凶必须提交其他类别。';if(s.peek)txt+=' 查牌：'+s.peek.name+' · '+s.peek.type; if(!done)for(const c of s.hand){const valid=s.role==='真凶'?c.type!==s.target:c.type===s.target;$('options').innerHTML+=option(c.type,c.label,valid?"sendAction({action:'submit',cardId:'"+c.id+"'})":'void 0',valid?'':'bad')}else txt+=' 已提交，等待其他玩家。'}
 if(s.phase==='reveal'){txt='牌已混洗公开；根据调查记录推理谁是真凶。';if(host)$('buttons').innerHTML='<button class="primary" onclick="sendAction({action:\'next\'})">进入下一阶段</button>';else txt+=' 等待房主继续。'}
 if(s.phase==='vote'){txt='指认一位真凶。全部良人指认正确才算良人获胜。';if(!done)for(const p of players().filter(x=>x.id!==s.you))$('options').innerHTML+=option(p.name,'确认指认',"sendAction({action:'vote',playerId:'"+p.id+"'})");else txt+=' 已投票，等待结算。'}
 if(s.phase==='end'){txt='游戏结束，角色与投票公开。';$('options').innerHTML=players().map(p=>'<div class="seat"><strong>'+esc(p.name)+'</strong><small>'+esc(p.role)+'</small></div>').join('');if(host)$('buttons').innerHTML='<button class="primary" onclick="sendAction({action:\'reset\'})">重新开局</button>'}
 $('instructions').textContent=txt;$('publicCards').innerHTML=s.reveal.map(c=>'<div class="card '+(s.target&&c.type!==s.target?'bad':'')+'"><strong>'+esc(c.type)+'</strong><small>'+esc(c.label)+'</small></div>').join('');$('history').innerHTML=s.history.map(x=>'<p>第 '+x.round+' 轮 · '+esc(x.target)+'：'+x.cards.map(c=>esc(c.type)).join('、')+'</p>').join('')}
let old=sessionStorage.getItem('sgm_online_auth');if(old){try{auth=JSON.parse(old);openSocket()}catch(e){}}else{let code=new URLSearchParams(location.search).get('room');if(code)$('roomInput').value=code.toUpperCase()}
</script></html>
