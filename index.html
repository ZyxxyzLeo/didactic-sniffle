  }

    const ordered=[...r.players.filter(p=>p.id!==r.me.id),r.players.find(p=>p.id===r.me.id)];

    return `<div class="table-scene"><div class="table-rail"><div class="table-felt"><div class="table-line"></div></div></div><div class="table-center"><div class="table-wordmark">百乐门</div><span>THE LAST SONG · 1935</span><div class="table-phase">${r.phase==='reveal'?`<div class="table-card-stack">${icon('cards')}</div>`:icon(r.phase==='inspect'?'magnifying-glass':r.phase==='submit'?'cards':r.phase==='vote'?'spy':'mask')}<b>${E(flowName[r.phase])}</b></div><small>${r.targetType?`本轮指定 · ${E(r.targetType)}`:'秘密还在每个人手中'}</small></div>
    ${ordered.map((p,i)=>{const mine=p.id===r.me.id; const a=mine?Math.PI/2:(Math.PI/2+2*Math.PI*(i+1)/n);const x=50+41*Math.cos(a),y=mine?80:49+35*Math.sin(a);const interactive=!mine&&(r.phase==='inspect'&&!r.me.peekDone||r.phase==='vote'&&!r.me.voted);const selected=app.selTarget===p.id||app.selVote===p.id;return `<button class="table-seat ${mine?'self':''} ${selected?'selected':''}" style="--sx:${x.toFixed(2)}%;--sy:${y.toFixed(2)}%" ${interactive?`data-action="${r.phase==='inspect'?'target':'pick-vote'}" data-id="${E(p.id)}"`:''} aria-label="${E(p.name)}${interactive?'，点击选择':''}" ${!interactive?'aria-disabled="true"':''}>${playerAvatar(p)}<span class="seat-name">${E(p.name)}${mine?' · 你':''}</span><span class="seat-state">${p.bot?'模拟宾客':!p.online?'离线托管':mine?'你的座位':'在线'} ${p.id===r.hostId?'♛':''}</span>${selected?'<span class="seat-selected">✓</span>':''}</button>`}).join('')}
    <div class="scene-caption">${r.phase==='inspect'&&!r.me.peekDone?'点一位宾客，调查 TA 的暗牌':r.phase==='vote'?'你的最后一票，将决定今夜结局':'牌已入局，且听各位辩词'}</div></div>`;
  }
  function renderGame(r) {

  function closeRules() { el('modal').hidden=true; el('modal').innerHTML=''; document.body.style.overflow=''; }
  async function copy(value) {
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
      else {
        const t=document.createElement('textarea');
        t.value=value;t.style.position='fixed';t.style.top='-1000px';document.body.appendChild(t);t.select();
        if (!document.execCommand('copy')) throw new Error('copy refused');
        t.remove();
      }
      toast('已复制到剪贴板', 'success');
    } catch(e) { toast('浏览器限制复制，请长按选择文字手动复制', 'error'); }
  }
  document.addEventListener('submit', async (event) => {
    if (event.target.id === 'createForm') {
      event.preventDefault();
      const name=el('createName').value.trim();
      store.setItem('sgm.nickname', name);
      await createRoom(name);
    } else if (event.target.id === 'joinForm') {
      event.preventDefault();
      const name=el('joinName').value.trim();
      store.setItem('sgm.nickname', name);
      await joinRoom(el('joinCode').value, name);
    } else if (event.target.id === 'chatForm') {
      event.preventDefault();
      const text=el('chatInput').value.trim();
      if (text) { app.chatDraft=''; wsAction('chat',{text});el('chatInput').value=''; }
    }
  });
  document.addEventListener('input', (e) => { if (e.target.id==='chatInput') app.chatDraft=e.target.value; });
  document.addEventListener('click', (e) => {
    if (e.target === el('modal')) closeRules();
    const button=e.target.closest('button'); if (!button || button.disabled) return;
    playSound('click');
    const ui=button.dataset.ui;
    if(ui==='identity'){app.roleShown=!app.roleShown;render();return;}
    if(ui==='sound'){app.sound=!app.sound;store.setItem('sgm.sound',app.sound?'1':'0');render();if(app.sound)playSound('turn');return;}
    if(ui==='pane'){app.pane=button.dataset.pane;render();return;}
    if(ui==='credits'){creditsModal();return;}
    if(ui==='room-info'){roomInfoModal();return;}
    if (ui==='rules') {rulesModal();return;}
    if (ui==='close') {closeRules();return;}
    const action=button.dataset.action;
    if (!action) return;
    const id=button.dataset.id;
    if (action==='solo') {
      const name=store.getItem('sgm.nickname') || '夜宴来客';
      createRoom(name, true);return;
    }
    if (action==='copy-code') { copy(app.room.code);return; }
    if (action==='copy-link') { copy(invitation());return; }
    if (action==='target') {app.selTarget=id;app.selSlot=null;render();if(innerWidth<700)document.querySelector('.phase-work')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
    if (action==='slot') {app.selSlot=Number(button.dataset.slot);render();return;}
    if (action==='peek-confirm') { if (app.selTarget && app.selSlot) wsAction('peek',{playerId:app.selTarget,slot:app.selSlot});return; }
    if (action==='card') {app.selCard=id;render();return;}
    if (action==='submit-confirm') {if(app.selCard) wsAction('submit',{cardId:app.selCard});return;}
    if (action==='pick-vote') {app.selVote=id;render();return;}
    if (action==='vote-confirm') {if(app.selVote) wsAction('vote',{playerId:app.selVote});return;}
    if(action==='leave'&&window.SGMSolo){if(confirm('离开并结束本地牌局？')){window.SGMSolo.clear();app.room=null;app.status='idle';app.pane='table';app.notes=[];closeRules();render()}return;}
    if (action==='leave') {if (confirm('确定离开？开局后离开会暂时保留你的座位，并由托管完成回合。')) {closeRules();app.shouldReconnect=false;wsAction('leave');setTimeout(clearRoomSession,250);}return;}
    if (action==='kick') {if (!confirm('确认将该玩家移出候场？'))return;}
    wsAction(action, id?{playerId:id}:{});
  });
  el('brandHome').addEventListener('click',() => window.scrollTo({top:0,behavior:'smooth'}));
  window.addEventListener('keydown',(e)=>{if(e.key==='Escape' && !el('modal').hidden) closeRules();});
  async function boot() {
    if(window.SGMSolo){app.room=window.SGMSolo.load();app.status=app.room?'online':'idle';render();return;}
    try {const resp=await fetch('/api/health');if(resp.ok)app.health=await resp.json();}
    catch(e) { toast('无法连接服务器；请确认已启动 server.py', 'error'); }
    const code=(app.joinCode || store.getItem('sgm.last') || '').toUpperCase();
    const token=store.getItem('sgm:'+code);
    if (token && /^[A-HJ-NP-Z2-9]{6}$/.test(code)) {app.code=code;app.token=token;connect();}
    render();
  }

  function rememberPeek() {
    const r=app.room;if(!r||r.phase==='lobby')return;
    const key='sgm.notes:'+r.code+':'+r.me.id;
    if(!app.notes.length){try{const data=JSON.parse(store.getItem(key)||'[]');app.notes=Array.isArray(data)?data.filter(n=>n&&n.code===r.code&&Number.isInteger(n.round)):[]}catch{app.notes=[]}}
    const note=r.me.peek;
    if(note && !app.notes.some(n=>n.code===r.code&&n.round===r.round)){
      app.notes.push({code:r.code,round:r.round,...note});store.setItem(key,JSON.stringify(app.notes));
    }
    if(r.phase==='inspect'&&r.round===1&&!r.me.peekDone&&app.notes.length){app.notes=[];store.removeItem(key);}
  }
  let audioContext=null;
  function playSound(type) {
    if(!app.sound)return;
    try {
      audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
      if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
      const now=audioContext.currentTime;
      const gain=audioContext.createGain();gain.connect(audioContext.destination);
      gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(type==='turn'?.05:.018,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+(type==='turn'?.35:.07));
      const osc=audioContext.createOscillator();osc.type='sine';osc.frequency.setValueAtTime(type==='turn'?523.25:240,now);osc.frequency.exponentialRampToValueAtTime(type==='turn'?783.99:120,now+.065);osc.connect(gain);osc.start();osc.stop(now+.4);
    }catch{} // Audio is optional; never blocks gameplay.
  }
  function genericModal(title,body) {
    el('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${E(title)}"><button class="modal-close" data-ui="close" aria-label="关闭">×</button><div class="tiny-label">THE LAST SONG / PRIVATE EDITION</div><h2>${E(title)}</h2>${body}</div>`;
    el('modal').hidden=false;document.body.style.overflow='hidden';el('modal').querySelector('button')?.focus();
  }
  function creditsModal() {
    genericModal('美术与素材署名',`<p>Game-icons.net 图标：Lorc 与 Delapouite。遵循 CC BY 3.0，已移除背景并重着色；素材已随项目本地打包。</p><div class="credits-grid">${['spy','rose','mask','revolver','hat','magnifying-glass'].map(k=>`<div>${icon(k)}<small>${k}</small></div>`).join('')}</div><p>来源：<a href="https://game-icons.net/" target="_blank" rel="noopener">Game-icons.net</a> · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a></p><p>其余小图标、Art Deco 装饰、牌桌、卡背与界面布局由本项目代码实现；交互提示音由浏览器实时合成。没有使用原作美术、商业卡图或外部字体文件。</p><button class="btn btn-gold btn-big" data-ui="close">返回夜宴</button>`);
  }
  function roomInfoModal(){
    if(!app.room)return;
    const r=app.room;
    genericModal('牌局信息',`<div class="invitation-ticket"><div><span>PRIVATE ROOM</span><b>${E(r.code)}</b></div></div><div class="player-list">${r.players.map(p=>renderSeat(p,r)).join('')}</div><p class="helper-note">${window.SGMSolo?'此版本为离线单人演示，不连接其他设备。':'席位已锁定，刷新原页面可恢复席位。离线超过 22 秒由程序托管，房主可自动交接。'}</p><div class="host-tools">${!window.SGMSolo?'<button class="btn btn-outline" data-action="copy-link">复制房间链接</button>':''}<button class="btn btn-danger" data-action="leave">离开牌局</button><button class="btn btn-gold" data-ui="close">返回</button></div>`);
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&app.roleShown){app.roleShown=false;render()}});
  // Keep keyboard focus inside an open dialog.
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'||el('modal').hidden)return;const nodes=Array.from(el('modal').querySelectorAll('button:not([disabled]),a[href],input'));if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});

  boot();
})();
</script></body></html>
